<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7BD5" /> <!-- Start color (a vibrant blue) -->
      <stop offset="100%" stop-color="#00D2FF" /> <!-- End color (a lighter, energetic blue) -->
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background for a modern app icon look -->
  <rect x="0" y="0" width="100" height="100" rx="15" ry="15" fill="url(#gradient)"/>

  <!-- Stylized "AI" text centered, signifying Artificial Intelligence -->
  <text x="50" y="50" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">AI</text>
</svg>